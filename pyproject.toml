[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wikihopper"
version = "0.1.0"
description = "Ambiguity-aware path finding for exploratory retrieval over multilingual Wikipedia"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ahmet Kapkiç" }, { name = "Yusuf Mücahit Çetinkaya" }]
dependencies = []

[project.urls]
Repository = "https://github.com/tweetpie/wiki-hopper"

[project.scripts]
wikihopper = "wikihopper.__main__:main"

[tool.setuptools.packages.find]
include = ["wikihopper*"]

[tool.setuptools.package-data]
"wikihopper.explorer" = ["web/*.html", "web/*.css", "web/js/*.js"]
